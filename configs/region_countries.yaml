# Region -> member countries (ISO 3166-1 alpha-3), used only by the choropleth in
# viz/charts.py.
#
# WHY THIS FILE EXISTS
# The Global E-Commerce Sales dataset records geography at continent level only -- its
# `region` column holds six values (Asia, North America, Europe, South America,
# Australia, Africa) and there is no country column. Plotly's choropleth needs country
# shapes to draw, so each region is expanded to its member countries and every country
# in a region is filled with that region's aggregate value.
#
# HONEST-ENCODING NOTE
# This paints countries, but it is not country-level data and must never be read as
# such. viz/charts.py binds the hover text to the REGION name and the REGION total, so
# hovering Japan shows "Asia -- <Asia's total>", not a Japan figure. The chart title
# says "by Region" for the same reason, and tests/test_viz.py asserts the hover
# template never references %{location}.
#
# WHY ISO-3 RATHER THAN COUNTRY NAMES
# Plotly emits a DeprecationWarning for `locationmode: "country names"` -- the name
# lookup it uses is changing, and names are ambiguous across vintages anyway
# (Myanmar/Burma, Eswatini/Swaziland, Czechia/Czech Republic). ISO-3 codes are stable
# and unambiguous, so the binding sets `locationmode: "ISO-3"` and this file lists
# codes. The English name is kept as an inline comment for readability.
#
# Kept in its own file rather than inside dataset_config.yaml purely for readability.
# It is still configuration, not code, so the generic/specific boundary in
# PROJECT_SPEC.md Section 2 holds.
#
# Transcontinental cases are judgment calls, resolved here once and documented rather
# than left implicit:
#   - RUS Russia -> Europe (conventional geopolitical grouping, though most of its
#                   landmass is in Asia; it is the largest single visual footprint)
#   - TUR Turkey -> Asia
#   - EGY Egypt  -> Africa
#   - Central America and the Caribbean -> North America (standard geographic usage)
#   - "Australia" is the dataset's label for what is geographically Oceania, so it
#     covers the Pacific island nations too.

