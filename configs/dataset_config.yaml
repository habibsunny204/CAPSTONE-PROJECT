# Dataset configuration for the Global E-Commerce Sales capstone project.
#
# This is the single place dataset-specific detail is allowed to live (PROJECT_SPEC.md
# Section 2's generic/specific boundary): the raw-to-normalized column rename map, PII
# handling rules, the synonym dictionary, and curated-chart column bindings. Every
# other module reads from this file rather than hardcoding column names as string
# literals.
#
# The dataset is 500,000 transaction rows across 10 columns, spanning 2022-01-01 to
# 2024-01-01. It has no nulls and no duplicate rows in the raw file -- the quality
# profiling in Task A3 confirms this rather than assuming it.

dataset:
  raw_csv_path: "data/raw/global_ecommerce_sales.csv"
  table_name: "ecommerce_sales"
  encoding: "utf-8"
  # No id_column: this dataset has no surrogate key or order identifier (unlike
  # Superstore's Row.ID), so every column is genuine data and full-row duplicate
  # detection in A3 is meaningful without needing to exclude anything. Consumers read
  # this key with .get(), so its absence is handled.

# PII handling (PROJECT_SPEC.md Section 2 hard gate): resolved before any schema JSON
# derived from this data can reach an LLM prompt. There is no customer-name column in
# this dataset, so nothing is dropped outright. Customer ID is pseudonymous but
# re-identifiable against other copies of this dataset, so it is hashed (not dropped)
# to preserve unique/repeat-customer analytics while breaking the identity linkage.
pii:
  drop_columns: []
  hash_columns:
    "Customer ID": "customer_id_hash"
  hash_salt_env_var: "PII_HASH_SALT"
  hash_length: 16

# Raw header -> normalized snake_case name. Applied after the PII step above
# ("Customer ID" is handled by the pii section, not here).
columns:
  rename_map:
    "Transaction Date": "transaction_date"
    "Region": "region"
    "Product": "product"
    "Category": "category"
    "Price": "price"
    "Quantity": "quantity"
    # Renamed with an explicit _pct suffix because this column is a percentage on a
    # 0-30 scale, NOT a 0-1 fraction. The name carries that unit into the schema JSON
    # the LLM sees, which is the cheapest available defence against the model writing
    # `discount > 0.2` when the user asks for "more than 20% discount".
    "Discount (%)": "discount_pct"
    "Total Revenue": "total_revenue"
    "Payment Method": "payment_method"

# Task A3 (quality.py) reads this section to decide what to clean, rather than
# hardcoding column names in the cleaning code.
quality:
  date_columns:
    - "transaction_date"
  # Nothing to drop: unlike Superstore (which carried a constant-value Tableau
  # row-counter artifact), every column here has real information content. Kept as an
  # explicit empty list rather than removed, so the decision is visible.
  drop_after_profiling: []
  # Closed-vocabulary business-category columns eligible for casing standardization
  # (trim + title-case). Deliberately narrow, on the same reasoning as the rest of this
  # file: title-casing is only safe where the vocabulary is small, fixed and ordinary
  # English. payment_method is deliberately EXCLUDED -- it contains "PayPal", which
  # naive title-casing mangles to "Paypal". product is excluded as a high-cardinality
  # (10,000 distinct) synthetic identifier, not a business category.
  categorical_casing_columns:
    - "category"
    - "region"
  # Calendar parts derived from transaction_date during cleaning. This dataset has no
  # Year column of its own (Superstore did), and the Trend Analysis preset insight
  # needs a discrete time dimension to group by -- deriving these restores that
  # capability rather than degrading the preset into a non-time comparison.
  derive_date_parts:
    transaction_date:
      year: "year"
      month: "month"

# Task B3: curated aggregation for the "Trend/Comparison Analysis" preset insight.
# Keeps llm/pipeline.py generic (no column literals) -- the Dataset Overview and
# Anomaly/Outlier Report presets need no such config since they're fully data-driven
# (profile_report() and "the numeric column with the most IQR outliers", picked at
# runtime, not named here).
insights:
  trend_comparison:
    dims: ["year"]
    metrics: ["total_revenue", "quantity"]
    aggs: ["sum"]

# A4's benchmark_perf.py reads these scenarios rather than hardcoding column names.
benchmark:
  scenarios:
    - name: "revenue_by_region_credit_card"
      dims: ["region"]
      metrics: ["total_revenue"]
      aggs: ["sum"]
      filters:
        - {column: "payment_method", op: "=", value: "Credit Card"}
    - name: "revenue_quantity_by_region_category_2023plus"
      dims: ["region", "category"]
      metrics: ["total_revenue", "quantity"]
      aggs: ["sum", "avg"]
      filters:
        - {column: "transaction_date", op: ">=", value: "2023-01-01"}
    - name: "avg_revenue_high_discount_transactions"
      dims: ["category"]
      metrics: ["total_revenue"]
      aggs: ["avg"]
      filters:
        - {column: "discount_pct", op: ">", value: 20}

# Task B1: informal-phrase -> actual column name, injected into every SQL-generation
# prompt alongside the introspected schema JSON (llm/prompts.py reads this; the
# phrases themselves are only ever rendered as prompt text, never executed, so casing
# here just needs to read naturally).
synonyms:
  revenue: total_revenue
  sales: total_revenue
  turnover: total_revenue
  "total sales": total_revenue
  "order value": total_revenue
  "amount spent": total_revenue
  "unit price": price
  "list price": price
  "item price": price
  units: quantity
  "units sold": quantity
  "number ordered": quantity
  "items purchased": quantity
  discount: discount_pct
  "% off": discount_pct
  "percent off": discount_pct
  "discount rate": discount_pct
  "discount percentage": discount_pct
  continent: region
  "world region": region
  market: region
  territory: region
  "product category": category
  "product type": category
  "product line": category
  department: category
  item: product
  sku: product
  "product name": product
  "payment type": payment_method
  "payment option": payment_method
  "how they paid": payment_method
  "purchase date": transaction_date
  "sale date": transaction_date
  "order date": transaction_date
  customer: customer_id_hash
  "unique customers": customer_id_hash
  "repeat customers": customer_id_hash
  "calendar year": year
  "fiscal year": year
  "month number": month

# Task B1: 2-3 few-shot question -> SQL examples, in the exact structured-output shape
# Phase 1 (llm/pipeline.py) asks the LLM to produce. Dataset-specific by nature (they
# reference real column names), so centralized here rather than hardcoded in
# llm/prompts.py, consistent with this file's role as the one place dataset-specific
# detail is allowed to live.
few_shot_examples:
  - question: "What is the total revenue by region?"
    reasoning: "'Revenue' maps to total_revenue. Group by region and sum total_revenue."
    sql: "SELECT region, SUM(total_revenue) AS revenue FROM ecommerce_sales GROUP BY region ORDER BY revenue DESC"
  - question: "What is the average order value for transactions with more than 20% discount?"
    reasoning: "discount_pct is stored as a percentage on a 0-30 scale, not a 0-1 fraction, so 'more than 20% discount' is discount_pct > 20 (not > 0.2). 'Order value' maps to total_revenue."
    sql: "SELECT AVG(total_revenue) AS avg_order_value FROM ecommerce_sales WHERE discount_pct > 20"
  - question: "Show me the top 5 categories by revenue in Europe."
    reasoning: "Filter to region = 'Europe', group by category, sum total_revenue, sort descending, limit 5."
    sql: "SELECT category, SUM(total_revenue) AS revenue FROM ecommerce_sales WHERE region = 'Europe' GROUP BY category ORDER BY revenue DESC LIMIT 5"

# Task C2: which columns feed each of the curated charts. viz/charts.py reads these
# rather than hardcoding column names, so the dataset-specific detail stays in this one
# file (PROJECT_SPEC.md Section 2). viz/auto_select.py needs no bindings at all -- it
# keys off result *shape*, never column identity.
charts:
  # Shared display settings so every chart looks like part of one system.
  theme:
    template: "plotly_white"
    # Categorical palette, assigned in this fixed order and never cycled. Verified
    # colorblind-safe with the data-viz palette validator (worst adjacent CVD
    # deltaE 9.1, worst adjacent normal-vision deltaE 19.6, both above their gates)
    # -- do not reorder casually: the slot ordering is what makes it CVD-safe, not
    # cosmetic. Scatter/choropleth-style charts (where any pair can end up
    # adjacent) cap at the first 3 slots, which validate on all pairs.
    categorical_colors:
      - "#2a78d6"
      - "#eb6834"
      - "#1baf7a"
      - "#eda100"
      - "#e87ba4"
      - "#008300"
      - "#4a3aa7"
      - "#e34948"

  curated_bindings:
    time_series:
      date_column: "transaction_date"
      metrics: ["total_revenue", "quantity"]
      title: "Revenue and Units Sold Over Time"
      x_title: "Transaction Date"
    choropleth:
      # This dataset's geography stops at continent level -- there is no country
      # column. Rather than drop the map, each region is expanded to its member
      # countries (region_countries_path) and every country in a region is shaded with
      # that region's total. PROJECT_SPEC.md:197 explicitly permits "choropleth by
      # Country/Region". The hover text is bound to the region name and the region
      # total, never a country name, so the chart cannot be misread as country-level
      # data it does not have.
      #
      # ISO-3 rather than "country names": Plotly deprecates the country-name lookup,
      # and ISO codes are unambiguous across Natural Earth vintages.
      location_column: "region"
      metric: "total_revenue"
      color_scale: "Blues"
      locationmode: "ISO-3"
      region_countries_path: "configs/region_countries.yaml"
      title: "Total Revenue by Region"
    correlation_heatmap:
      columns: ["price", "quantity", "discount_pct", "total_revenue"]
      color_scale: "RdBu"
      title: "Correlation Between Numeric Measures"
    box_plot:
      category_column: "category"
      metric: "total_revenue"
      title: "Revenue Distribution by Category"
    sunburst:
      path: ["region", "category", "payment_method"]
      metric: "total_revenue"
      title: "Revenue by Region, Category and Payment Method"
    scatter_regression:
      x: "discount_pct"
      y: "total_revenue"
      point_label: "Transactions"
      title: "Discount vs Revenue"
    stacked_bar:
      primary_dim: "region"
      secondary_dim: "category"
      metric: "total_revenue"
      title: "Revenue by Region and Category"
    animated_bar:
      # C2's slider-driven animated chart. `period` is a pandas offset alias passed to
      # Series.dt.to_period -- "M" over this dataset's 2022-01..2024-01 span gives 25
      # frames, enough to read as motion. "Q" or "Y" if that is too fine.
      date_column: "transaction_date"
      dimension: "category"
      metric: "total_revenue"
      period: "M"
      title: "Revenue by Category, Month by Month"

# Task C1: which columns become global sidebar filters, and how each is rendered.
# Kept here (not in app.py) for the same reason as everything else in this file.
filters:
  - column: "transaction_date"
    label: "Transaction date range"
    type: "date_range"
  - column: "region"
    label: "Region"
    type: "multiselect"
  - column: "category"
    label: "Category"
    type: "multiselect"
  - column: "payment_method"
    label: "Payment method"
    type: "multiselect"

# Labels used by the dashboard chrome and exported reports. Kept here so retargeting
# the platform to another dataset stays a config change rather than a code edit.
app:
  title: "E-Commerce AI Analytics"
  dataset_display_name: "Global E-Commerce Sales"
  # Headline metrics on the Overview tab. Each is skipped if its column is absent.
  kpis:
    - {label: "Total revenue", column: "total_revenue", agg: "sum", format: ",.0f"}
    - {label: "Units sold", column: "quantity", agg: "sum", format: ",.0f"}
    - {label: "Customers", column: "customer_id_hash", agg: "nunique", format: ",.0f"}
  # Shown in the AI Assistant tab's empty state -- questions this dataset can answer.
  example_questions:
    - "What is the total revenue by region?"
    - "Which category sells the most units?"
    - "What is the average order value for transactions with more than 20% discount?"
  # Extra columns carried alongside flagged rows in the anomaly report (Task D1).
  anomaly_context_columns: ["transaction_date", "region", "category", "product", "payment_method"]
  # Default metric selection in comparative analysis (Task D2).
  comparison_default_metrics: ["total_revenue", "quantity"]
